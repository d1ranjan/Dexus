services:
  - type: web
    name: dexus-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install --global pnpm@9.12.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: WEB_APP_URL
        value: https://d1ranjan.github.io/Dexus
      - key: CORS_ALLOWED_ORIGINS
        value: https://d1ranjan.github.io
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OWNER_SUPABASE_USER_ID
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
